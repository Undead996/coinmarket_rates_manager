apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Release.Name }}-ingress"
spec:
  rules:
    - host: "{{ .Values.ingress.host }}"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: "{{ .Release.Name }}-service"
                port:
                  number: 80
  {{- if .Values.ingress.tls.secret_name }}
  tls:
  - hosts:
    - "{{ .Values.ingress.host }}"
    secretName: "{{ .Values.ingress.tls.secret_name }}"
  {{- end}}
